name: Terraform CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/jayeshdhawadejd/azure-terraform-cicd/portfolio-flask:latest app/

      - name: Push image to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/jayeshdhawadejd/azure-terraform-cicd/portfolio-flask:latest

      - name: Terraform Init
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }} \
            -e ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }} \
            -e ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }} \
            -e ARM_USE_OIDC=true \
            hashicorp/terraform:1.10.5 init

      - name: Terraform Plan
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }} \
            -e ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }} \
            -e ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }} \
            -e ARM_USE_OIDC=true \
            hashicorp/terraform:1.10.5 plan

  apply:
    name: Terraform Apply
    needs: plan
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }} \
            -e ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }} \
            -e ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }} \
            -e ARM_USE_OIDC=true \
            hashicorp/terraform:1.10.5 init

      - name: Terraform Apply
        run: |
          docker run --rm -v ${{ github.workspace }}:/workspace -w /workspace \
            -e ARM_CLIENT_ID=${{ secrets.ARM_CLIENT_ID }} \
            -e ARM_TENANT_ID=${{ secrets.ARM_TENANT_ID }} \
            -e ARM_SUBSCRIPTION_ID=${{ secrets.ARM_SUBSCRIPTION_ID }} \
            -e ARM_USE_OIDC=true \
            hashicorp/terraform:1.10.5 apply -auto-approve