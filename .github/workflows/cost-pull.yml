name: Cost Data Pull

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

jobs:
  pull-costs:
    name: Pull Cost Data
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Run cost data script
        run: ./scripts/Get-CostData.ps1